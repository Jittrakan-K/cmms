# เผยแพร่ firestore.rules ขึ้น Firebase อัตโนมัติทุกครั้งที่ไฟล์นี้เปลี่ยนบน main
# ใช้ Workload Identity Federation (ไม่มีไฟล์กุญแจ) ตั้งค่าครั้งเดียวตาม README หัวข้อ "เผยแพร่ firestore.rules อัตโนมัติ"
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/workflows/deploy-rules.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules
  cancel-in-progress: false

env:
  PROJECT: cmmsepic
  WIF_PROVIDER: projects/607234875826/locations/global/workloadIdentityPools/github/providers/cmms
  SERVICE_ACCOUNT: github-rules-deploy@cmmsepic.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Publish rules
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API=https://firebaserules.googleapis.com/v1/projects/$PROJECT
          # 1) สร้างชุดกฎใหม่ (Firebase ตรวจไวยากรณ์ตรงนี้ ถ้าผิดจะหยุดและกฎเดิมยังใช้ต่อ)
          jq -n --rawfile src firestore.rules '{source:{files:[{name:"firestore.rules",content:$src}]}}' > body.json
          code=$(curl -sS -o ruleset.json -w '%{http_code}' -X POST "$API/rulesets" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @body.json)
          if [ "$code" != 200 ]; then echo "::error::สร้างชุดกฎไม่สำเร็จ (HTTP $code)"; cat ruleset.json; exit 1; fi
          RULESET=$(jq -r .name ruleset.json)
          echo "ruleset: $RULESET"
          # 2) ชี้ Cloud Firestore ไปใช้ชุดกฎใหม่
          jq -n --arg n "projects/$PROJECT/releases/cloud.firestore" --arg r "$RULESET" '{release:{name:$n,rulesetName:$r}}' > rel.json
          code=$(curl -sS -o out.json -w '%{http_code}' -X PATCH "$API/releases/cloud.firestore" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @rel.json)
          if [ "$code" != 200 ]; then echo "::error::เผยแพร่ไม่สำเร็จ (HTTP $code)"; cat out.json; exit 1; fi
          echo "เผยแพร่ firestore.rules แล้ว"
